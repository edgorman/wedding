$schema: '../cache/schemas/tasks.json'

# Every project tagged 'terraform' (infra-root, infra-env) picks these up without repeating them.
inheritedBy:
  tags: ['terraform']

tasks:
  format:
    command: 'terraform fmt -check'
  validate:
    script: 'terraform init -backend=false -input=false && terraform validate'
    options:
      cache: false        # init writes .terraform/, which is gitignored
      # `terraform init` needs registry.terraform.io, which a Claude Code cloud session may not reach
      # (see AGENTS.md): runs in CI only.
      runInCI: 'only'
  # Marker for security.yaml's terraform job (tflint and trivy read every .tf file).
  scan:
    command: 'noop'
    inputs:
      - '**/*'
      - '/.prototools'
      - '/.github/workflows/security.yaml'
      - '/.github/scripts/advisory.sh'
    options:
      cache: false
