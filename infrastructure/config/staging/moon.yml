$schema: '../../../.moon/cache/schemas/project.json'
# The dependency on deploy-root is apply ordering (`needs:` in push-commit.yaml is the real one),
# modelled so `moon project-graph` reads right.
dependsOn: ['infra-env', 'deploy-root']
tags: ['deployment']

tasks:
  # Marker for pull-request.yaml's plan job: 'inputs' define what reaches this
  # environment's PR plan. Only the plan's own action and workflow are listed.
  plan:
    command: 'noop'
    inputs:
      - 'terraform.tfbackend'
      - 'terraform.tfvars'
      - 'project://infra-env'
      - '/.github/actions/terraform-pull-request/**/*'
      - '/.github/workflows/pull-request.yaml'
    options:
      cache: false

  # Marker for push-commit.yaml's apply job: 'inputs' define what reaches this
  # environment's apply on a merge. Only the apply's own actions and workflow are listed.
  apply:
    command: 'noop'
    inputs:
      - 'terraform.tfbackend'
      - 'terraform.tfvars'
      - 'project://infra-env'
      - '/.github/actions/terraform-push-commit/**/*'
      - '/.github/workflows/push-commit.yaml'
    options:
      # Never runInCI: false (decision 5).
      cache: false
