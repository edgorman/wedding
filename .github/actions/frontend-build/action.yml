name: 'Frontend Build'
description: 'Installs dependencies and builds the frontend production bundle'

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/frontend-node

    - name: Install Dependencies
      shell: bash
      working-directory: services/frontend
      run: npm ci

    # The bundle is environment-neutral, so one dist/ serves every environment; what differs is
    # written at deploy time as config.json (decision 9).
    - name: Build
      shell: bash
      working-directory: services/frontend
      run: npm run build
