name: 'Frontend Build'
description: 'Installs dependencies and builds the frontend production bundle'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: services/frontend/package-lock.json

    - name: Install Dependencies
      shell: bash
      working-directory: services/frontend
      run: npm ci

    - name: Build
      shell: bash
      working-directory: services/frontend
      run: npm run build
