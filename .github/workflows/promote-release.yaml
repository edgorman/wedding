name: 'Promote Release'

# Fires when a pre-release is promoted to a Release, or an older one is re-promoted to roll back.
on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: promote-release-main
  cancel-in-progress: false

jobs:
  # Step 1: infra applies before the site is touched, from the plan saved when this pre-release
  # was cut (the one in its notes). If prod changed since, as on any rollback, it plans again here.
  infrastructure-prod:
    # Every later job needs this one, so skipping it here skips the whole promotion on a repository
    # whose infrastructure/root hasn't been bootstrapped yet.
    if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          plan_dir: gs://${{ vars.GCP_PROJECT_PREFIX }}-prod-terraform-state/plans/prod
          secrets: |
            TF_VAR_ci_service_account=${{ vars.SERVICE_ACCOUNT }}

  # Step 2: fetch the commit-SHA folder already published to prod's own bucket when this commit was built
  # and validated on staging (a rollback fetches an earlier release's, already sitting there too),
  # then deploy those static files to prod's Cloudflare Pages project. No cross-project read and no
  # copy - the bucket promotion reads from is prod's own.
  services-frontend:
    needs: infrastructure-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: ${{ vars.GCP_ROOT_PROJECT }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            CLOUDFLARE_API_TOKEN=cloudflare_api_token
            CLOUDFLARE_ACCOUNT_ID=cloudflare_account_id
      - uses: ./.github/actions/frontend-fetch
        with:
          gcp_project_id: '${{ vars.GCP_PROJECT_PREFIX }}-prod'
          sha: ${{ github.sha }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-deploy
        with:
          secrets: ${{ steps.secrets.outputs.secrets }}
          cloudflare_project_name: '${{ vars.GCP_PROJECT_PREFIX }}-prod'
