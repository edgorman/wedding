name: 'Push Commit'

# Every push to main except a release-please release commit, which push-release.yaml handles. A
# release commit changes only the files release-please owns, and a push that changes only those is
# the one `paths-ignore` skips; a push that also changes anything else runs both files.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - '.github/.release-please-manifest.json'

permissions:
  contents: read

concurrency:
  group: push-commit-root-main
  cancel-in-progress: false

jobs:
  # moon decides which Terraform deployments an apply reaches, as pull-request.yaml's `changed` job
  # decides which to plan. The frontend's publish marker decides whether it is rebuilt; otherwise
  # base_sha's bundle is reused (decision 10).
  changed:
    # Skipped until root's bootstrap writes the repository variables (infrastructure/AGENTS.md); everything
    # that deploys waits on this job.
    if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      # With no base to diff against, everything is affected.
      infrastructure-root: ${{ steps.base.outputs.base == '' || fromJSON(steps.affected.outputs.affected || '{}').root }}
      infrastructure-staging: ${{ steps.base.outputs.base == '' || fromJSON(steps.affected.outputs.affected || '{}').staging }}
      frontend: ${{ steps.base.outputs.base == '' || fromJSON(steps.affected.outputs.affected || '{}').frontend }}
      deployable: ${{ steps.base.outputs.base == '' || fromJSON(steps.affected.outputs.affected || '{}').deployable }}
      base_sha: ${{ steps.base.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: 'blob:none'
      - id: base
        name: Choose the diff base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Diffed against the last commit this workflow fully processed (decision 6): the
          # previous commit when its own run succeeded, else the newest release tag before this
          # commit. So a merge builds and applies only what it changes, not everything since the last
          # release. A cancelled or failed run is never the base, so its work is redone. HEAD~1 is
          # the diff end, so a re-run of a tagged commit sees its own changes. With no base, every
          # deployment is marked affected.
          base=
          prev=$(git rev-parse HEAD~1)
          if [ "$(gh run list --workflow push-commit.yaml --branch main --commit "$prev" --status success --json databaseId --jq length)" -gt 0 ]; then
            base=$prev
          else
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD~1 2>/dev/null || true)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then
            echo "Diffing against $base"
            echo "base_sha=$(git rev-list -n 1 "$base")" >> "$GITHUB_OUTPUT"
          fi
      - id: affected
        if: steps.base.outputs.base != ''
        uses: ./.github/actions/moon-affected
        with:
          base: ${{ steps.base.outputs.base }}
          tasks: |
            root=deploy-root:apply
            staging=deploy-staging:apply
            frontend=services/frontend:publish
            deployable=deploy-root:apply deploy-staging:apply services/frontend:publish

  infrastructure-root:
    needs: changed
    if: needs.changed.outputs.infrastructure-root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            github_provider_token: projects/${{ vars.GCP_ROOT_PROJECT }}/secrets/github_provider_token/versions/latest
            cloudflare_api_token: projects/${{ vars.GCP_ROOT_PROJECT }}/secrets/cloudflare_api_token/versions/latest
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
        env:
          TF_VAR_github_provider_token: ${{ steps.secrets.outputs.github_provider_token }}
          TF_VAR_cloudflare_api_token: ${{ steps.secrets.outputs.cloudflare_api_token }}

  # Waits on infrastructure-root so any IAM grants or API enablement it applies land first. A status
  # function in `if:` (`!failure()`) stops a skipped need skipping this job too; a failed one still does.
  infrastructure-staging:
    needs: [changed, infrastructure-root]
    if: ${{ !cancelled() && !failure() && needs.changed.outputs.infrastructure-staging == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/staging'
        env:
          TF_VAR_ci_service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

  # Runs on every merge, so every commit on `main` has a commit-SHA bundle in both environments. It
  # builds when the frontend is affected; otherwise it publishes base_sha's folder again under this
  # commit (or builds, if that folder has aged out). It deploys either way, so staging shows this
  # commit. One folder feeds both buckets and the Worker; the steps are in the frontend-staging action.
  frontend:
    needs: [changed, infrastructure-root, infrastructure-staging]
    if: ${{ !cancelled() && !failure() && needs.changed.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Signed in once for every step below, including the composite action.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/frontend-staging
        with:
          reuse_from: ${{ needs.changed.outputs.frontend != 'true' && needs.changed.outputs.base_sha || '' }}
          cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          root_project_id: ${{ vars.GCP_ROOT_PROJECT }}
          gcp_project_id: ${{ vars.GCP_PROJECT_PREFIX }}-stag
          prod_project_id: ${{ vars.GCP_PROJECT_PREFIX }}-prod
          worker_name: ${{ vars.GCP_PROJECT_PREFIX }}-stag
          site_url: ${{ vars.PRODUCTION_URL }}
          site_name: ${{ vars.SITE_NAME }}

  # Skipped when this merge changes nothing deployable: the staging site is then the one the last
  # smoke test passed. Checks the live staging site serves the page; release-please waits on it.
  smoke:
    needs: [changed, frontend]
    if: ${{ !cancelled() && !failure() && needs.frontend.result == 'success' && needs.changed.outputs.deployable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Staging site serves the page
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          # A fresh deploy or a new custom domain can answer 403 for a few minutes before the edge
          # serves it, so poll for up to ~5 minutes rather than failing on the first window.
          for attempt in $(seq 1 20); do
            if curl -fsS "$STAGING_URL/" | grep -qi "<title>.*wedding</title>"; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::$STAGING_URL did not serve the expected page"
          exit 1

  # Opens or updates the release PR, so it lists this commit. Tagging the release is
  # push-release.yaml's job, on the release PR's own merge (decision 11). It waits on this commit's
  # deploy and smoke test: `!failure()` lets a skipped smoke (nothing deployable changed) through,
  # and `frontend` must have run and passed, since a skipped publish job is not release-worthy.
  release-please:
    needs: [frontend, smoke]
    if: ${{ !cancelled() && !failure() && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      pr_number: ${{ steps.release.outputs.prs_created == 'true' && fromJSON(steps.release.outputs.pr).number || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The PAT, so the release PR triggers the PR checks (decision 11).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            release_please_token: projects/${{ vars.GCP_ROOT_PROJECT }}/secrets/github_provider_token/versions/latest
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.secrets.outputs.release_please_token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # The prod plan for the open release PR, so a reviewer sees what merging will apply (decision 14).
  plan-prod:
    needs: release-please
    if: needs.release-please.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pull_request_number: ${{ needs.release-please.outputs.pr_number }}
        env:
          TF_VAR_ci_service_account: ${{ vars.PROMOTE_SERVICE_ACCOUNT }}
