$schema: './.moon/cache/schemas/project.json'
workspace:
  # The root project inherits no tasks: an inherited repo-wide check would run against the whole tree.
  inheritedTasks:
    include: []

tasks:
  # A services/* folder without a moon.yml is one the project globs silently skip, so
  # check for the file directly (decision 4).
  projects-covered:
    description: 'Every services/* folder is a moon project'
    script: |
      missing=0
      for dir in services/*/; do
        dir="${dir%/}"
        if [ ! -f "$dir/moon.yml" ]; then
          echo "::error file=$dir::${dir} has no moon.yml - every services/* folder must be a moon project."
          missing=1
        fi
      done
      exit "$missing"
    # Recursive: a single '*' never crosses a '/', so it would never see a new folder's files.
    inputs:
      - '/services/**/*'
      - '/.moon/workspace.yml'

  # Every docs/decisions/NNNN-*.md a Markdown file links must exist.
  decision-links:
    description: 'Every decision record linked from a Markdown file exists'
    script: |
      missing=0
      while IFS=: read -r file link; do
        if [ ! -f "docs/decisions/${link#decisions/}" ]; then
          echo "::error file=$file::links ${link}, which does not exist in docs/decisions/."
          missing=1
        fi
      done < <(grep -rEo --include='*.md' --exclude-dir=node_modules --exclude-dir=.git 'decisions/[0-9]{4}-[a-z0-9-]+\.md' . | sed 's|^\./||')
      exit "$missing"
    inputs:
      - '/**/*.md'
      - '!/CHANGELOG.md'

  # Marker for security.yaml's workflows job: actionlint and zizmor read these.
  scan-workflows:
    command: 'noop'
    inputs:
      - '/.github/workflows/**/*'
      - '/.github/actions/**/*'
      - '/.github/scripts/**/*'
    options:
      cache: false

  # Marker for security.yaml's secrets job: any file can leak a secret, so everything counts except
  # release-please's generated files and prose (docs/ and Markdown files), which a docs-only PR
  # changes (decision 16). A PR that also touches code, config, a workflow or Terraform still scans.
  scan-secrets:
    command: 'noop'
    inputs:
      - '/**/*'
      - '!/CHANGELOG.md'
      - '!/.github/.release-please-manifest.json'
      - '!/docs/**/*'
      - '!/**/*.md'
    options:
      cache: false

  # Style and structure of every Markdown file (rules in /.markdownlint-cli2.jsonc). Runs as a
  # lint-check target, so it reaches a PR that changes a Markdown file or the config and nothing else.
  # CHANGELOG.md is generated by release-please and ignored by the config as well.
  markdown-lint:
    description: 'Markdown files pass markdownlint'
    # renovate: datasource=npm depName=markdownlint-cli2
    command: 'npx --yes markdownlint-cli2@0.24.1 "**/*.md"'
    inputs:
      - '/**/*.md'
      - '!/CHANGELOG.md'
      - '/.markdownlint-cli2.jsonc'
