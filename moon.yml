$schema: './.moon/cache/schemas/project.json'
workspace:
  # The root project must not inherit tasks meant for real projects (e.g. .moon/tasks/terraform.yml's
  # format/validate, tagged 'terraform').
  inheritedTasks:
    include: []

tasks:
  # A services/* folder without its own moon.yml is exactly the folder the services/*/moon.yml glob
  # would silently skip discovering as a project, so check for the file directly.
  projects-covered:
    description: 'Every services/* folder is a moon project'
    script: |
      missing=0
      for dir in services/*/; do
        dir="${dir%/}"
        if [ ! -f "$dir/moon.yml" ]; then
          echo "::error file=$dir::${dir} has no moon.yml - every services/* folder must be a moon project."
          missing=1
        fi
      done
      exit "$missing"
    # Recursive, not '/services/*': a single '*' never crosses a '/'.
    inputs:
      - '/services/**/*'
      - '/.moon/workspace.yml'
