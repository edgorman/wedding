$schema: '../../.moon/cache/schemas/project.json'
language: 'typescript'
layer: 'application'
stack: 'frontend'
tags: ['typescript']

# The typescript toolchain stays off: its sync rewrites the hand-maintained tsconfig references.
toolchains:
  typescript: false
# moon's own dependency install is off workspace-wide (.moon/toolchains.yml), so `install` is the
# one `npm ci` every task depends on.

fileGroups:
  sources: ['src/**/*', 'public/**/*', 'worker/**/*', 'index.html', 'vite.config.ts', 'wrangler.jsonc']
  configs: ['package.json', 'package-lock.json', 'tsconfig*.json', '.oxlintrc.json']

tasks:
  install:
    command: 'npm ci'
    inputs: ['package.json', 'package-lock.json']
    options:
      internal: true
  lint:
    command: 'npm run lint'
    deps: ['install']
    inputs: ['@group(sources)', '@group(configs)']
  typecheck:
    command: 'npx tsc -b'
    deps: ['install']
    inputs: ['@group(sources)', '@group(configs)']
  test:
    command: 'npm test'
    deps: ['install']
    inputs: ['@group(sources)', '@group(configs)']
  build:
    command: 'npm run build'
    deps: ['install']
    inputs: ['@group(sources)', '@group(configs)']
    # The whole folder, not a glob: moon deletes files under `outputs` that don't match on hydration.
    outputs: ['dist']
  dev:
    command: 'npm run dev'
    deps: ['install']
    preset: 'server'
  # A marker task, like the deploy-*:plan ones: its 'inputs' decide whether a merge rebuilds the
  # bundle or reuses the last release's (push-commit.yaml's `changed` job, decision 10).
  publish:
    command: 'noop'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '/.github/actions/frontend-artifact/**/*'
      - '/.github/actions/frontend-build/**/*'
      - '/.github/actions/frontend-node/**/*'
      - '/.github/actions/frontend-publish/**/*'
    options:
      cache: false

  # Marker for security.yaml's frontend job: npm audit reads the lockfile.
  scan:
    command: 'noop'
    inputs:
      - '@group(configs)'
      - '/.prototools'
      - '/.github/actions/frontend-node/**/*'
      - '/.github/workflows/security.yaml'
      - '/.github/scripts/advisory.sh'
    options:
      cache: false
